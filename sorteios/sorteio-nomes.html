<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteio de Nomes</title>
  <style>
    :root {
      --tinta-900: #050505;
      --tinta-800: #111111;
      --tinta-700: #2a2a2a;
      --vermelho-500: #d91616;
      --vermelho-300: #ff4d4d;
      --texto: #f5f5f5;
      --texto-suave: #d4d4d4;
      --erro: #ffb3a7;
      --perigo: #b31212;
      --fonte-serifa: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --fonte-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--tinta-900);
      color: var(--texto);
      font-family: var(--fonte-sans);
      display: flex;
      flex-direction: column;
    }

    .cabecalho {
      padding: 30px 20px 10px;
      text-align: center;
    }

    .cabecalho__titulo {
      margin: 0;
      font-family: var(--fonte-serifa);
      color: var(--vermelho-300);
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .cabecalho__subtitulo {
      margin: 8px 0 0;
      color: var(--texto-suave);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .menu-navegacao {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      width: min(100%, 42rem);
      margin: 0 auto 1rem;
      padding: 0.7rem 1rem;
      background: rgba(17, 17, 17, 0.9);
      border: 1px solid var(--tinta-700);
      border-radius: 999px;
    }

    .menu-navegacao__link {
      padding: 0.55rem 1rem;
      border-radius: 999px;
      color: var(--texto-suave);
      text-decoration: none;
      font-weight: 600;
    }

    .menu-navegacao__link--ativo {
      background: var(--vermelho-500);
      color: #fff;
    }

    .principal {
      width: min(90%, 760px);
      margin: 0 auto;
      padding: 20px 0 50px;
      flex: 1;
    }

    .cartao {
      background: var(--tinta-800);
      border: 1px solid var(--vermelho-500);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(217, 22, 22, 0.12);
    }

    textarea, input, button {
      font: inherit;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      background: var(--tinta-900);
      color: var(--texto);
      border: 1px solid var(--tinta-700);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1.05rem;
    }

    .botoes {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .btn-principal {
      background: var(--vermelho-500);
      color: #fff;
    }

    .btn-secundario {
      background: transparent;
      border: 1px solid var(--tinta-700);
      color: var(--texto);
    }

    .resultado {
      position: relative;
      margin-top: 26px;
      background: #0e0e0e;
      border: 1px solid rgba(255, 77, 77, 0.35);
      border-radius: 12px;
      padding: 24px 18px;
      min-height: 170px;
      display: grid;
      place-items: center;
      overflow: hidden;
      text-align: center;
    }

    .resultado::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 77, 77, 0.18), rgba(255, 77, 77, 0) 60%);
      opacity: 0;
      pointer-events: none;
    }

    .resultado.revelando::before {
      animation: flashFundo 1.2s ease-out;
    }

    .resultado__rotulo {
      margin: 0 0 12px;
      color: var(--vermelho-300);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.8rem;
    }

    .resultado__valor {
      margin: 0;
      font-family: var(--fonte-serifa);
      font-size: clamp(3rem, 9vw, 8rem);
      line-height: 1;
      color: var(--texto);
      transform-origin: center;
      opacity: 0;
      filter: blur(16px);
      text-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
    }

    .resultado__valor.aparecendo {
      animation: revelarNome 2.2s cubic-bezier(0.18, 0.89, 0.32, 1.3) forwards;
    }

    @keyframes revelarNome {
      0% {
        opacity: 0;
        transform: scale(0.1) rotate(-18deg) translateY(24px);
        filter: blur(18px) brightness(2.4);
      }
      25% {
        opacity: 0.4;
        transform: scale(0.6) rotate(-10deg) translateY(12px);
        filter: blur(12px) brightness(1.8);
      }
      42% {
        opacity: 1;
        transform: scale(1.28) rotate(8deg) translateY(-12px);
        filter: blur(0) brightness(1.7);
      }
      70% {
        opacity: 1;
        transform: scale(0.96) rotate(-3deg) translateY(4px);
        filter: blur(0) brightness(1.2);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg) translateY(0);
        filter: blur(0) brightness(1);
      }
    }

    @keyframes flashFundo {
      0% { opacity: 0; }
      22% { opacity: 1; }
      60% { opacity: 0.75; }
      100% { opacity: 0; }
    }

    .link-voltar {
      display: inline-block;
      margin-top: 20px;
      color: var(--vermelho-300);
      text-decoration: none;
      font-weight: 600;
    }

    .link-voltar:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      .cartao { padding: 18px; }
      .botoes { flex-direction: column; }
      .botoes button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="cabecalho">
    <h1 class="cabecalho__titulo">Sorteio de Nomes</h1>
    <p class="cabecalho__subtitulo">ADTAG Avenida P1</p>
  </header>

  <main class="principal">
    <section class="cartao">
      <nav class="menu-navegacao" aria-label="Menu do sorteador">
        <a class="menu-navegacao__link" href="../index.html">Números</a>
        <a class="menu-navegacao__link menu-navegacao__link--ativo" href="sorteio-nomes.html">Nomes</a>
        <a class="menu-navegacao__link" href="sorteio-equipes.html">Equipes</a>
      </nav>

      <label for="nomes" style="display:block; margin-bottom:10px; color: var(--texto-suave); font-weight:600;">Digite os nomes, um por linha ou separados por vírgula:</label>
      <textarea id="nomes" placeholder="Exemplo: Maria, João, José, Ana"></textarea>

      <div class="botoes">
        <button type="button" class="btn-principal" id="sortearNome">Sortear Nome</button>
        <button type="button" class="btn-secundario" id="limparNomes">Limpar</button>
      </div>

      <div class="resultado" id="resultadoNome">
        <div>
          <p class="resultado__rotulo">Nome sorteado</p>
          <p class="resultado__valor" id="valorNome">?</p>
        </div>
      </div>

      <a class="link-voltar" href="index.html">← Voltar para o sorteio principal</a>
    </section>
  </main>

  <script>
    const nomesInput = document.getElementById('nomes');
    const valorNome = document.getElementById('valorNome');
    const resultado = document.getElementById('resultadoNome');

    function limparLista() {
      nomesInput.value = '';
      valorNome.textContent = '?';
      valorNome.classList.remove('aparecendo');
      resultado.classList.remove('revelando');
    }

    function extrairNomes(texto) {
      return texto
        .split(/\n|,/) 
        .map(nome => nome.trim())
        .filter(nome => nome.length > 0);
    }

    function sortearNome() {
      const nomes = extrairNomes(nomesInput.value);
      if (nomes.length === 0) {
        valorNome.textContent = 'Adicione nomes';
        valorNome.classList.remove('aparecendo');
        return;
      }

      const sorteado = nomes[Math.floor(Math.random() * nomes.length)];
      valorNome.textContent = sorteado;
      valorNome.classList.remove('aparecendo');
      void valorNome.offsetWidth;
      valorNome.classList.add('aparecendo');
      resultado.classList.remove('revelando');
      void resultado.offsetWidth;
      resultado.classList.add('revelando');
    }

    document.getElementById('sortearNome').addEventListener('click', sortearNome);
    document.getElementById('limparNomes').addEventListener('click', limparLista);
  </script>
</body>
</html>
